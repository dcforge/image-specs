name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check quality
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts
          test -f dist/cli.js

      - name: Verify installed package
        run: |
          PACKAGE_TARBALL=$(npm pack --silent)
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$PACKAGE_TARBALL" --ignore-scripts
          node --input-type=module -e "const { getImageSpecs } = await import('@dcforge/image-specs'); if (typeof getImageSpecs !== 'function') process.exit(1)"
          node -e "const { getImageSpecs } = require('@dcforge/image-specs'); if (typeof getImageSpecs !== 'function') process.exit(1)"
          "$SMOKE_DIR/node_modules/.bin/image-specs" --version

  test:
    name: Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: '22.22.1'
            coverage: true
          - os: ubuntu-latest
            node-version: '24'
            smoke: true
          - os: windows-latest
            node-version: '22.22.1'
            smoke: true
          - os: macos-latest
            node-version: '22.22.1'
            smoke: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: matrix.coverage != true
        run: npm test -- --run

      - name: Run tests with coverage
        if: matrix.coverage == true
        run: npm run test:coverage -- --run

      - name: Build package for installation smoke test
        if: matrix.smoke == true
        run: npm run build

      - name: Verify installed package
        if: matrix.smoke == true
        shell: bash
        run: |
          PACKAGE_TARBALL=$(npm pack --silent)
          PACKAGE_PATH=$(node -e "console.log(require('node:path').resolve(process.argv[1]))" "$PACKAGE_TARBALL")
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE_PATH" --ignore-scripts
          node --input-type=module -e "const { getImageSpecs } = await import('@dcforge/image-specs'); if (typeof getImageSpecs !== 'function') process.exit(1)"
          node -e "const { getImageSpecs } = require('@dcforge/image-specs'); if (typeof getImageSpecs !== 'function') process.exit(1)"
          npm exec -- image-specs --version

      - name: Upload coverage
        if: matrix.coverage == true
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-image-specs
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  ci-success:
    name: CI Success
    needs: [quality, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TEST_RESULT" = "success"
