name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-type:
        description: Release type
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze Commits
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.analyze.outputs.should-release }}
      release-type: ${{ steps.analyze.outputs.release-type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Analyze commits since last release
        id: analyze
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "release-type=$MANUAL_RELEASE_TYPE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LATEST_TAG" ]; then
            COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:%s)
          else
            COMMITS=$(git log --pretty=format:%s)
          fi

          if [ -z "$COMMITS" ]; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qiE '^(BREAKING CHANGE|[a-z]+(\([a-z]+\))?!:)'; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "release-type=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qiE '^feat(\([a-z]+\))?:'; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "release-type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qiE '^fix(\([a-z]+\))?:'; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "release-type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Create Release
    needs: [analyze]
    if: needs.analyze.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Verify release credentials
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: test -n "$PAT_TOKEN"

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        env:
          RELEASE_TYPE: ${{ needs.analyze.outputs.release-type }}
        run: |
          npm version "$RELEASE_TYPE" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag "$TAG"
          git push origin main "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        run: npm run release -- --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
